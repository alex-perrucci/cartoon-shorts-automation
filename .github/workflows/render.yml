name: Render cartoon short

on:
  push:
    paths:
      - "input/**/*.json"
  workflow_dispatch:
    inputs:
      input_file:
        description: "Input JSON path, e.g. input/2026-09-17-am.json"
        required: true
        type: string
      dry_run:
        description: "Use local placeholder images instead of packaged scene assets"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: cartoon-render-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TTS_VOICE: it-IT-DiegoNeural
      TTS_RATE: "-4%"
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_TOKEN_KEY: ${{ secrets.TIKTOK_TOKEN_KEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve input file
        id: input
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT_FILE="${{ inputs.input_file }}"
            if [ -z "$INPUT_FILE" ] || [ ! -f "$INPUT_FILE" ]; then
              echo "Could not resolve requested input JSON: $INPUT_FILE" >&2
              exit 1
            fi
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "file=$INPUT_FILE" >> "$GITHUB_OUTPUT"
            echo "Using $INPUT_FILE"
            exit 0
          fi
          mapfile -t INPUT_FILES < <(git diff-tree --diff-filter=AM --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^input/.*\.json$' || true)
          if [ "${#INPUT_FILES[@]}" -eq 0 ]; then
            echo "No added/modified input manifest in this push; skipping render."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${#INPUT_FILES[@]}" -gt 1 ]; then
            printf 'Expected exactly one added/modified input manifest, found %s:\n' "${#INPUT_FILES[@]}" >&2
            printf ' - %s\n' "${INPUT_FILES[@]}" >&2
            exit 1
          fi
          INPUT_FILE="${INPUT_FILES[0]}"
          test -f "$INPUT_FILE"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "file=$INPUT_FILE" >> "$GITHUB_OUTPUT"
          echo "Using $INPUT_FILE"

      - uses: actions/setup-python@v5
        if: steps.input.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        if: steps.input.outputs.skip != 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        if: steps.input.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Render
        id: render
        if: steps.input.outputs.skip != 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          INPUT_FILE="${{ steps.input.outputs.file }}"
          EXTRA=""
          PACKAGE_MODE="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("render_mode", ""))' "$INPUT_FILE")"
          {
            if { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; } || [ "$PACKAGE_MODE" = "dry_run" ]; then
              EXTRA="--dry-run"
            else
              echo "Preparing scheduler-generated SVG scene artwork..."
              python scripts/prepare_svg_assets.py "$INPUT_FILE"
              echo "Validating prepared scene assets before TTS/render..."
              python render_entry.py --input "$INPUT_FILE" --validate-assets
            fi
            python render_entry.py --input "$INPUT_FILE" $EXTRA
          } 2>&1 | tee render.log

      - name: Resolve output directory
        id: output
        if: always() && steps.input.outputs.skip != 'true' && steps.input.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          ID="$(python -c 'import json,sys,re; d=json.load(open(sys.argv[1], encoding="utf-8")); print(re.sub(r"[^a-zA-Z0-9._-]+", "-", str(d["id"])).strip("-") or "short")' "${{ steps.input.outputs.file }}")"
          echo "dir=output/$ID" >> "$GITHUB_OUTPUT"

      - name: Upload output artifact
        if: steps.render.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: cartoon-short-${{ github.run_id }}
          path: ${{ steps.output.outputs.dir }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload private draft to YouTube
        id: youtube
        if: github.ref == 'refs/heads/main' && steps.render.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          INPUT_FILE="${{ steps.input.outputs.file }}"
          VIDEO="${{ steps.output.outputs.dir }}/final_video.mp4"
          ID="$(python -c 'import json,sys,re; d=json.load(open(sys.argv[1], encoding="utf-8")); print(re.sub(r"[^a-zA-Z0-9._-]+", "-", str(d["id"])).strip("-") or "short")' "$INPUT_FILE")"
          RECEIPT=".social_receipts/youtube/$ID.json"
          if [ -f "$RECEIPT" ]; then
            echo "YouTube receipt already exists for $ID; skipping duplicate upload."
            cat "$RECEIPT"
            exit 0
          fi
          if [ -z "${YOUTUBE_CLIENT_ID:-}" ] || [ -z "${YOUTUBE_CLIENT_SECRET:-}" ] || [ -z "${YOUTUBE_REFRESH_TOKEN:-}" ]; then
            echo "YouTube OAuth not configured; skipping private upload."
            exit 0
          fi
          if ! python -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); raise SystemExit(0 if isinstance(d.get("youtube"), dict) else 1)' "$INPUT_FILE"; then
            echo "Manifest has no youtube metadata; skipping private upload."
            exit 0
          fi
          python scripts/upload_youtube.py --video "$VIDEO" --manifest "$INPUT_FILE" | tee youtube-upload.log
          mkdir -p "$(dirname "$RECEIPT")"
          tail -n 1 youtube-upload.log > "$RECEIPT"
          python -m json.tool "$RECEIPT" >/dev/null

      - name: Persist YouTube upload receipt
        if: always() && github.ref == 'refs/heads/main' && steps.render.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .auth/tiktok_tokens.enc
          if [ -d .social_receipts ]; then
            git add .social_receipts
          fi
          if git diff --cached --quiet; then
            echo "No YouTube receipt changes to persist."
            exit 0
          fi
          git commit -m "chore: persist YouTube upload state"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload failure logs
        if: always() && steps.input.outputs.skip != 'true' && (steps.render.outcome != 'success' || steps.youtube.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: cartoon-short-failure-${{ github.run_id }}
          path: |
            render.log
            youtube-upload.log
            tiktok-upload.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Send failure to Telegram when configured
        if: always() && steps.input.outputs.skip != 'true' && (steps.render.outcome != 'success' || steps.youtube.outcome == 'failure')
        shell: bash
        run: |
          set -u
          if [ -z "${TELEGRAM_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram not configured; skipping failure notification."
            exit 0
          fi
          INPUT_FILE="${{ steps.input.outputs.file }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MESSAGE=$(printf '❌ Cartoon short pipeline issue\nInput: %s\nRender: %s\nYouTube: %s\n%s' "$INPUT_FILE" "${{ steps.render.outcome }}" "${{ steps.youtube.outcome }}" "$RUN_URL")
          curl --fail --silent --show-error --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" --data-urlencode "text=$MESSAGE" "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage"

      - name: Fail job when render or YouTube upload failed
        if: always() && steps.input.outputs.skip != 'true' && (steps.render.outcome != 'success' || steps.youtube.outcome == 'failure')
        run: exit 1
