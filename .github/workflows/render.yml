name: Render cartoon short

on:
  push:
    paths:
      - "input/**/*.json"
  workflow_dispatch:
    inputs:
      input_file:
        description: "Input JSON path, e.g. input/2026-09-17-am.json"
        required: true
        type: string
      dry_run:
        description: "Use placeholder images instead of Gemini"
        required: false
        default: false
        type: boolean

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      IMAGE_PROVIDER: gemini
      IMAGE_MODEL: gemini-3.1-flash-image
      TTS_VOICE: it-IT-IsabellaNeural
      TTS_RATE: "+8%"
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve input file
        id: input
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT_FILE="${{ inputs.input_file }}"
          else
            INPUT_FILE="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^input/.*\.json$' | tail -n 1)"
          fi
          if [ -z "$INPUT_FILE" ] || [ ! -f "$INPUT_FILE" ]; then
            echo "Could not resolve input JSON" >&2
            exit 1
          fi
          echo "file=$INPUT_FILE" >> "$GITHUB_OUTPUT"
          echo "Using $INPUT_FILE"

      - name: Render
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA="--dry-run"
          fi
          python main.py --input "${{ steps.input.outputs.file }}" $EXTRA

      - name: Resolve output directory
        id: output
        shell: bash
        run: |
          ID="$(python -c 'import json,sys,re; d=json.load(open(sys.argv[1], encoding="utf-8")); print(re.sub(r"[^a-zA-Z0-9._-]+", "-", str(d["id"])).strip("-") or "short")' "${{ steps.input.outputs.file }}")"
          echo "dir=output/$ID" >> "$GITHUB_OUTPUT"

      - name: Upload output artifact
        uses: actions/upload-artifact@v4
        with:
          name: cartoon-short-${{ github.run_id }}
          path: ${{ steps.output.outputs.dir }}
          if-no-files-found: error
          retention-days: 14

      - name: Send to Telegram when configured
        if: always()
        shell: bash
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram not configured; skipping."
            exit 0
          fi
          VIDEO="${{ steps.output.outputs.dir }}/final_video.mp4"
          REPORT="${{ steps.output.outputs.dir }}/qc_report.json"
          if [ -f "$VIDEO" ]; then
            CAPTION="✅ Cartoon short rendered\nInput: ${{ steps.input.outputs.file }}"
            curl --fail --silent --show-error \
              -F "chat_id=$TELEGRAM_CHAT_ID" \
              -F "caption=$CAPTION" \
              -F "video=@$VIDEO" \
              "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendVideo"
          elif [ -f "$REPORT" ]; then
            curl --fail --silent --show-error \
              -F "chat_id=$TELEGRAM_CHAT_ID" \
              -F "document=@$REPORT" \
              -F "caption=❌ Cartoon short failed QC" \
              "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendDocument"
          fi
