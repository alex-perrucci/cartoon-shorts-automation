name: CI

on:
  push:
    paths:
      - "main.py"
      - "render_entry.py"
      - "requirements.txt"
      - "scripts/**"
      - "tests/**"
      - "examples/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "main.py"
      - "render_entry.py"
      - "requirements.txt"
      - "scripts/**"
      - "tests/**"
      - "examples/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      TTS_VOICE: it-IT-DiegoNeural
      TTS_RATE: "-4%"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile
        run: >-
          python -m py_compile
          main.py render_entry.py
          scripts/prepare_svg_assets.py
          scripts/oauth_youtube.py
          scripts/oauth_tiktok.py
          scripts/tiktok_tokens.py
          scripts/upload_youtube.py
          scripts/upload_tiktok_draft.py
          scripts/upload_tiktok_direct.py
          scripts/send_social_metadata.py
          tests/test_assets.py tests/test_subtitles.py
          tests/test_tiktok_direct.py tests/test_youtube_metadata.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Self test
        run: python render_entry.py --self-test
      - name: Dry-run production render
        run: python render_entry.py --input examples/example.json --dry-run
