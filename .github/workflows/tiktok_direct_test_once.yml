name: TikTok Direct test once

on:
  push:
    paths:
      - "input/2026-09-21-bnpl-direct-test.json"

permissions:
  contents: write

concurrency:
  group: tiktok-direct-test-once
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TTS_VOICE: it-IT-DiegoNeural
      TTS_RATE: "-4%"
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_TOKEN_KEY: ${{ secrets.TIKTOK_TOKEN_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Render approved private Direct Post test
        shell: bash
        run: |
          set -euo pipefail
          INPUT_FILE="input/2026-09-21-bnpl-direct-test.json"
          python scripts/prepare_svg_assets.py "$INPUT_FILE"
          python render_entry.py --input "$INPUT_FILE" --validate-assets
          python render_entry.py --input "$INPUT_FILE"

      - name: Direct post test to TikTok as SELF_ONLY
        id: tiktok
        shell: bash
        run: |
          set -euo pipefail
          INPUT_FILE="input/2026-09-21-bnpl-direct-test.json"
          ID="2026-09-21-bnpl-direct-test"
          VIDEO="output/$ID/final_video.mp4"
          RECEIPT=".social_receipts/tiktok_direct/$ID.json"
          if [ -f "$RECEIPT" ]; then
            echo "Receipt exists; refusing duplicate Direct Post."
            cat "$RECEIPT"
            exit 0
          fi
          python scripts/upload_tiktok_direct.py \
            --video "$VIDEO" \
            --manifest "$INPUT_FILE" \
            --privacy-level SELF_ONLY | tee tiktok-direct.log
          mkdir -p "$(dirname "$RECEIPT")"
          tail -n 1 tiktok-direct.log > "$RECEIPT"
          python -m json.tool "$RECEIPT" >/dev/null

      - name: Persist encrypted token state and receipt
        if: always() && steps.tiktok.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .auth/tiktok_tokens.enc .social_receipts/tiktok_direct
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: persist TikTok Direct Post test state"
          git pull --rebase origin main
          git push origin HEAD:main
